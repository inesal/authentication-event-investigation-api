services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lanl}
      POSTGRES_USER: ${POSTGRES_USER:-lanl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      APP_NAME: "${APP_NAME:-Authentication Event Investigation API}"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
      API_PREFIX: "${API_PREFIX:-/api/v1}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      SLOW_REQUEST_MS: "${SLOW_REQUEST_MS:-500}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost,http://localhost:8000}"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-3}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-10}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-5}"
      DB_POOL_TIMEOUT: "${DB_POOL_TIMEOUT:-20}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./:/app

volumes:
  postgres_data:
